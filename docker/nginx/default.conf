server {
    listen 80;
    server_name _;
    root /var/www/html/public;   # Laravel public dir (created in Phase 2 scaffold)
    index index.php;

    client_max_body_size 25M;    # attachments/imports (spec #37, #38)

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;    # 'app' service, PHP-FPM
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known).* {
        deny all;                 # block dotfiles (.env etc.)
    }
}
