# ==========================================================================
# ERP local stack — 100% free/open-source, runs entirely on your machine ($0).
#   app       : PHP 8.3-FPM (Laravel + Filament) — the application runtime
#   web       : nginx — serves public/ and proxies PHP
#   postgres  : PostgreSQL 16 — the database (authoritative store)
#   queue     : the same app image running the queue worker
#
# Nothing here depends on a paid cloud service. Mail/SMS/S3 are optional
# adapters configured only via .env, never required (spec #2, #39).
# ==========================================================================
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [erp]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [erp]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Superuser/owner role. The app connects with a *restricted* role created
      # by docker/postgres/init/10-app-role.sql (spec #10, #41).
      POSTGRES_USER: ${DB_ROOT_USERNAME}
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      APP_DB_USER: ${DB_USERNAME}
      APP_DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"      # exposed for local psql/backup only
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [erp]

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - ./:/var/www/html
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [erp]

networks:
  erp:
    driver: bridge
